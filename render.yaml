services:
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:packages && npm run build:backend
    startCommand: npm run start --workspace=@portfolio/backend
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "8"
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: FRONTEND_REVALIDATE_SECRET
        sync: false
      - key: AUTH_COOKIE_SAME_SITE
        value: lax
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
